name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create package.json
      run: |
        cat > package.json << 'EOF'
        {
          "name": "data-roda",
          "version": "1.0.0",
          "scripts": {
            "build": "echo build"
          }
        }
        EOF

    - name: Setup Android
      uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        mkdir apk
        cp index.html apk/index.html
        cd apk
        zip -r DATA-RODA-APK.zip .

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DATA-RODA-APK
        path: apk/DATA-RODA-APK.zip
